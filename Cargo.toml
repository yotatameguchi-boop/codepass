[package]
name = "codepass"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Offline, deterministic passwords from source code and a master secret"
repository = "https://github.com/yotatameguchi-boop/codepass"
readme = "README.md"
keywords = ["password", "argon2", "cli", "deterministic", "kdf"]
categories = ["command-line-utilities", "cryptography"]
exclude = [".github/", "tests/*.proptest-regressions"]

[dependencies]
arboard = { version = "3.6", default-features = false }
argon2 = "0.5"
clap = { version = "4.5", features = ["derive"] }
ctap-hid-fido2 = { version = "3.6.0", optional = true }
ctrlc = "3.5.2"
directories = "6"
getrandom = "0.2"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-security = "0.1.2"
zeroize = "1"
zxcvbn = "3.1.1"

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[features]
# Real FIDO2 security keys (USB HID). Off by default: needs hidapi.
fido2 = ["dep:ctap-hid-fido2"]

