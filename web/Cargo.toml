[package]
name = "codepass-web"
version = "0.0.0"
edition = "2021"
publish = false
description = "CodePass in the browser (WebAssembly demo). Same library as the CLI."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
codepass = { path = "..", default-features = false }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
